<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <!-- Background blob -->
  <ellipse cx="255" cy="295" rx="195" ry="178" fill="#e8f6f8" opacity="0.75"/>

  <!-- Phone shadow -->
  <ellipse cx="250" cy="508" rx="92" ry="11" fill="#b0c8cc" opacity="0.3"/>

  <!-- Phone body -->
  <rect x="135" y="42" width="230" height="440" rx="32" fill="white" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Speaker notch -->
  <rect x="205" y="60" width="90" height="8" rx="4" fill="#dde5ef"/>

  <!-- Home indicator -->
  <rect x="205" y="456" width="90" height="7" rx="3.5" fill="#dde5ef"/>

  <!-- Screen background -->
  <rect x="148" y="82" width="204" height="362" rx="6" fill="#f0f7ff"/>

  <!-- Username field -->
  <rect x="175" y="118" width="150" height="34" rx="8" fill="white" stroke="#dde5f0" stroke-width="1.5"/>
  <text x="188" y="140" fill="#b0bec5" font-family="Arial, sans-serif" font-size="11">you@example.com</text>

  <!-- Password field -->
  <rect x="175" y="165" width="150" height="34" rx="8" fill="white" stroke="#dde5f0" stroke-width="1.5"/>
  <!-- Password dots -->
  <circle cx="200" cy="182" r="5" fill="#4a6cf7" opacity="0.5"/>
  <circle cx="220" cy="182" r="5" fill="#4a6cf7" opacity="0.5"/>
  <circle cx="240" cy="182" r="5" fill="#4a6cf7" opacity="0.5"/>
  <circle cx="260" cy="182" r="5" fill="#4a6cf7" opacity="0.5"/>
  <circle cx="280" cy="182" r="5" fill="#4a6cf7" opacity="0.5"/>

  <!-- Lock shackle -->
  <path d="M216,258 L216,232 Q250,198 284,232 L284,258" fill="none" stroke="#22A0AB" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lock body -->
  <rect x="200" y="258" width="100" height="82" rx="13" fill="#22A0AB"/>

  <!-- Keyhole circle -->
  <circle cx="250" cy="293" r="11" fill="white" opacity="0.92"/>
  <!-- Keyhole stem -->
  <rect x="244" y="293" width="12" height="20" rx="6" fill="white" opacity="0.92"/>

  <!-- "DEVICE ONLY" pill badge -->
  <rect x="178" y="362" width="144" height="32" rx="16" fill="#4a6cf7"/>
  <text x="250" y="383" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">DEVICE ONLY</text>

  <!-- No-cloud badge (outside phone, top right) -->
  <circle cx="348" cy="108" r="26" fill="#fff0f0" stroke="#ffe0e0" stroke-width="1.5"/>
  <!-- Simple cloud -->
  <path d="M336,116 Q332,116 332,111 Q332,106 338,106 Q338,100 344,100 Q349,100 351,104 Q358,102 358,108 Q363,108 363,112 Q363,116 357,116 Z" fill="#ffb3b3" opacity="0.8"/>
  <!-- X mark -->
  <line x1="335" y1="101" x2="359" y2="117" stroke="#e05555" stroke-width="3" stroke-linecap="round"/>
  <line x1="359" y1="101" x2="335" y2="117" stroke="#e05555" stroke-width="3" stroke-linecap="round"/>
</svg>
