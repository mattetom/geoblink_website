<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Image Template</title>
  <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .og-card {
      width: 1200px;
      height: 630px;
      font-family: 'Sen', sans-serif;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    /* Large teal triangle — mirrors the homepage hero-shape */
    .og-card::before {
      content: '';
      position: absolute;
      width: 900px;
      height: 900px;
      background: #22A0AB;
      top: -420px;
      right: -260px;
      transform: rotate(35deg);
      border-radius: 60px;
      opacity: 0.12;
    }

    /* Smaller accent triangle */
    .og-card::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: #22A0AB;
      top: -180px;
      right: -100px;
      transform: rotate(35deg);
      border-radius: 40px;
      opacity: 0.08;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 50px 70px;
    }

    .text-side {
      flex: 1;
      max-width: 580px;
    }

    .image-side {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 40px;
    }

    .image-side img {
      height: 500px;
      width: auto;
      object-fit: contain;
    }

    .logo {
      height: 64px;
      width: auto;
      object-fit: contain;
      margin-bottom: 28px;
    }

    .tagline {
      font-size: 46px;
      font-weight: 800;
      color: #1D2A5D;
      line-height: 1.18;
      margin-bottom: 18px;
    }

    .tagline span {
      color: #22A0AB;
    }

    .subtitle {
      font-size: 21px;
      color: #5E678C;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .badges {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: #22A0AB;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
    }

    .badge.outline {
      background: transparent;
      color: #22A0AB;
      border: 2px solid #22A0AB;
    }

    .accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #22A0AB, #6de3ec);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="og-card">
    <div class="content">
      <div class="text-side">
        <img class="logo" src="logo/logo-blu.png" alt="GeoCam" />
        <div class="tagline"><span>Blink Geofencing</span><br/>Made Simple</div>
        <div class="subtitle">Arms when you leave.<br/>Disarms when you're home.<br/>Set your zone once, then forget it.</div>
      </div>
      <div class="image-side">
        <img src="hero/hero-img.png" alt="GeoCam app" />
      </div>
    </div>
    <div class="accent-bar"></div>
  </div>
</body>
</html>
